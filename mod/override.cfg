; Localization Pack for Melvor Idle 2, version 1.0.0 (unofficial). Languages: German (Deutsch), French (Français)
; Files are in "Mods/Localization Pack". Uninstall: delete this file and the folder "Mods/Localization Pack".

[autoload]

LocalizationPack="*res://Mods/Localization Pack/localization_pack.gd"

[internationalization]

locale/translations=PackedStringArray("res://Locale/en_GB.po", "res://Mods/Localization Pack/Languages/de_DE.po", "res://Mods/Localization Pack/Languages/fr_FR.po")
