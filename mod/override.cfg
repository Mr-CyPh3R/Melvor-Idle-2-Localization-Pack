; Localization Pack for Melvor Idle 2, version 1.2.0 (unofficial). Languages: German (Deutsch), French (Français), Spanish (Español), Brazilian Portuguese (Português), Japanese (日本語)
; Files are in "Mods/Localization Pack". Uninstall: delete this file and the folder "Mods/Localization Pack".

[autoload]

LocalizationPack="*res://Mods/Localization Pack/localization_pack.gd"

[internationalization]

locale/translations=PackedStringArray("res://Locale/en_GB.po", "res://Mods/Localization Pack/Languages/de_DE.po", "res://Mods/Localization Pack/Languages/fr_FR.po", "res://Mods/Localization Pack/Languages/es_ES.po", "res://Mods/Localization Pack/Languages/pt_BR.po", "res://Mods/Localization Pack/Languages/ja_JP.po")
